<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#f8fafc"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">CARLA–Apollo 仿真桥：分层架构与双向数据流</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">红色＝控制指令下行　蓝色＝传感/底盘/定位上行</text>

  <!-- Apollo -->
  <rect x="30" y="95" width="205" height="330" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="132" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">Apollo 容器</text>
  <text x="132" y="143" text-anchor="middle" font-size="12" fill="#6366f1">v8.0.0（文档） / v11–v12（目标）</text>
  <rect x="45" y="160" width="175" height="40" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="132" y="185" text-anchor="middle" font-size="13" fill="#1e293b">Dreamview :8888</text>
  <rect x="45" y="210" width="175" height="40" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="132" y="235" text-anchor="middle" font-size="13" fill="#1e293b">Planning / Routing</text>
  <rect x="45" y="260" width="175" height="40" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="132" y="285" text-anchor="middle" font-size="13" fill="#1e293b">Control（v9+ 插件化）</text>
  <rect x="45" y="310" width="175" height="40" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="132" y="335" text-anchor="middle" font-size="13" fill="#1e293b">Localization / Canbus</text>
  <rect x="45" y="360" width="175" height="40" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="132" y="385" text-anchor="middle" font-size="13" fill="#1e293b">Refined MPC（可选替换）</text>

  <!-- Cyber RT -->
  <rect x="270" y="95" width="230" height="330" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="385" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#115e59">Cyber RT 通道层</text>
  <text x="385" y="143" text-anchor="middle" font-size="12" fill="#0d9488">消息契约（跨版本相对稳定）</text>
  <rect x="285" y="165" width="200" height="34" rx="5" fill="#fff" stroke="#5eead4"/>
  <text x="385" y="187" text-anchor="middle" font-size="12" fill="#134e4a">/apollo/control  ← 订阅</text>
  <rect x="285" y="207" width="200" height="34" rx="5" fill="#fff" stroke="#5eead4"/>
  <text x="385" y="229" text-anchor="middle" font-size="12" fill="#134e4a">/apollo/canbus/chassis</text>
  <rect x="285" y="249" width="200" height="34" rx="5" fill="#fff" stroke="#5eead4"/>
  <text x="385" y="271" text-anchor="middle" font-size="12" fill="#134e4a">/apollo/localization/pose</text>
  <rect x="285" y="291" width="200" height="34" rx="5" fill="#fff" stroke="#5eead4"/>
  <text x="385" y="313" text-anchor="middle" font-size="12" fill="#134e4a">/apollo/sensor/camera/*</text>
  <rect x="285" y="333" width="200" height="34" rx="5" fill="#fff" stroke="#5eead4"/>
  <text x="385" y="355" text-anchor="middle" font-size="12" fill="#134e4a">/apollo/sensor/*/PointCloud2</text>
  <rect x="285" y="375" width="200" height="34" rx="5" fill="#fff" stroke="#5eead4"/>
  <text x="385" y="397" text-anchor="middle" font-size="12" fill="#134e4a">/apollo/perception/* · /tf</text]

  <!-- Bridge -->
  <rect x="535" y="95" width="225" height="330" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="647" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">carla_bridge（Python）</text>
  <text x="647" y="143" text-anchor="middle" font-size="12" fill="#ea580c">运行于 Apollo 容器内</text>
  <rect x="550" y="160" width="195" height="38" rx="5" fill="#fff" stroke="#fdba74"/>
  <text x="647" y="184" text-anchor="middle" font-size="12" fill="#7c2d12">main.py：同步 tick 主循环</text>
  <rect x="550" y="206" width="195" height="38" rx="5" fill="#fff" stroke="#fdba74"/>
  <text x="647" y="230" text-anchor="middle" font-size="12" fill="#7c2d12">core/node.py：CyberNode 封装</text>
  <rect x="550" y="252" width="195" height="38" rx="5" fill="#fff" stroke="#fdba74"/>
  <text x="647" y="276" text-anchor="middle" font-size="12" fill="#7c2d12">actor_factory：生成/注册 Actor</text>
  <rect x="550" y="298" width="195" height="38" rx="5" fill="#fff" stroke="#fdba74"/>
  <text x="647" y="322" text-anchor="middle" font-size="12" fill="#7c2d12">ego_vehicle：控制量映射</text>
  <rect x="550" y="344" width="195" height="38" rx="5" fill="#fff" stroke="#fdba74"/>
  <text x="647" y="368" text-anchor="middle" font-size="12" fill="#7c2d12">sensor/*：CAN/IMU/点云/图像</text>
  <rect x="550" y="390" width="195" height="38" rx="5" fill="#fff" stroke="#fdba74"/>
  <text x="647" y="414" text-anchor="middle" font-size="12" fill="#7c2d12">utils/transforms：坐标转换</text>

  <!-- CARLA -->
  <rect x="795" y="95" width="175" height="330" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="882" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">CARLA 容器</text>
  <text x="882" y="143" text-anchor="middle" font-size="12" fill="#dc2626">0.9.14 / RPC 2000</text>
  <rect x="810" y="165" width="145" height="48" rx="5" fill="#fff" stroke="#fca5a5"/>
  <text x="882" y="185" text-anchor="middle" font-size="12" fill="#7f1d1d">Unreal 世界</text>
  <text x="882" y="203" text-anchor="middle" font-size="11" fill="#7f1d1d">Town01/04 同步 tick</text>
  <rect x="810" y="225" width="145" height="48" rx="5" fill="#fff" stroke="#fca5a5"/>
  <text x="882" y="245" text-anchor="middle" font-size="12" fill="#7f1d1d">Ego / 交通参与者</text>
  <text x="882" y="263" text-anchor="middle" font-size="11" fill="#7f1d1d">VehicleControl 执行</text>
  <rect x="810" y="285" width="145" height="48" rx="5" fill="#fff" stroke="#fca5a5"/>
  <text x="882" y="305" text-anchor="middle" font-size="12" fill="#7f1d1d">相机/激光/雷达</text>
  <text x="882" y="323" text-anchor="middle" font-size="11" fill="#7f1d1d">GNSS / IMU</text>
  <rect x="810" y="345" width="145" height="48" rx="5" fill="#fff" stroke="#fca5a5"/>
  <text x="882" y="365" text-anchor="middle" font-size="12" fill="#7f1d1d">伪传感器</text>
  <text x="882" y="383" text-anchor="middle" font-size="11" fill="#7f1d1d">障碍物 / 红绿灯</text>

  <!-- control down arrow -->
  <path d="M 235 285 L 265 285" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <path d="M 505 285 L 530 285" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <path d="M 765 285 L 790 285" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="250" y="277" text-anchor="middle" font-size="10" fill="#c0392b">控制</text>
  <text x="518" y="277" text-anchor="middle" font-size="10" fill="#c0392b">控制</text>
  <text x="778" y="277" text-anchor="middle" font-size="10" fill="#c0392b">执行</text>

  <!-- sensor up arrow -->
  <path d="M 790 350 L 765 350" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 530 350 L 505 350" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 265 350 L 235 350" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="778" y="368" text-anchor="middle" font-size="10" fill="#2563eb">传感</text>
  <text x="518" y="368" text-anchor="middle" font-size="10" fill="#2563eb">发布</text>
  <text x="250" y="368" text-anchor="middle" font-size="10" fill="#2563eb">感知</text>

  <!-- bottom notes -->
  <rect x="30" y="455" width="940" height="82" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="45" y="480" font-size="13" font-weight="bold" fill="#0f172a">关键约定</text>
  <text x="45" y="503" font-size="12" fill="#334155">① 桥订阅 /apollo/control，不直接调用 Apollo 控制代码；故 proto/通道契约稳定时，桥主体可跨版本复用。</text>
  <text x="45" y="523" font-size="12" fill="#334155">② 精调控制器是「替换 Apollo 源码」的补丁：v9 起控制插件化，Apollo 12 必须按 pipeline + plugins.xml 重新落位。</text>
</svg>
